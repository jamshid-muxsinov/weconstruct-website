{# src/templates/admin/kanban_board.html #}
{% if not htmx_request %}
    {% extends "admin/base.html" %}
{% endif %}

{% block content %}
<div x-data>
    <div class="page-header">
        <h1>{{ _('sales_funnel') }}</h1>
        <div class="page-header-actions">
            <form class="filter-form" 
                  hx-get="{{ request.url_for('admin_htmx_kanban_content', locale=request.state.locale) }}"
                  hx-target="#kanban-board-container" 
                  hx-swap="innerHTML" 
                  hx-push-url="true">
                <label class="switch">
                    <input type="checkbox" name="show_archived" value="true" {% if show_archived %}checked{% endif %}
                        onchange="this.form.requestSubmit()">
                    <span class="slider"></span>
                </label>
                <span>{{ _('show_archived') }}</span>
            </form>

            <a href="{{ request.url_for('admin_quoterequest_add', locale=request.state.locale) }}" class="btn btn-primary">
                <i class='bx bx-plus'></i>
                {{ _('new_request') }}
            </a>
        </div>
    </div>

    <!-- Advanced Search and Filters -->
    <div class="advanced-filters">
        <div class="search-box" style="flex: 1; min-width: 250px;">
            <input type="text" 
                   x-model.debounce.300ms="$store.kanbanManager.searchQuery"
                   placeholder="{{ _('search_placeholder') }}"
                   class="input-field"
                   style="margin: 0;">
        </div>
        
        <div class="filter-chips" style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button type="button" 
                    @click="$store.kanbanManager.activeFilters.assignee = ($store.kanbanManager.activeFilters.assignee === 'me' ? null : 'me')"
                    :class="{'filter-chip': true, 'active': $store.kanbanManager.activeFilters.assignee === 'me'}">
                <i class='bx bx-user'></i>
                {{ _('my_tasks') }}
            </button>
            
            <button type="button"
                    @click="$store.kanbanManager.searchQuery = ''; $store.kanbanManager.activeFilters.assignee = null"
                    x-show="$store.kanbanManager.searchQuery || $store.kanbanManager.activeFilters.assignee"
                    class="btn btn-sm btn-secondary">
                <i class='bx bx-x'></i>
                {{ _('clear') }}
            </button>
        </div>
    </div>

    <!-- Bulk Actions Bar -->
    <div class="bulk-actions-bar" x-show="$store.kanbanManager.selectedCards.size > 0" x-transition>
        <span x-text="`{{ _('selected_cards_count', count='') }}${$store.kanbanManager.selectedCards.size}`" style="font-weight: 500;"></span>
        
        <select @change="$store.kanbanManager.bulkAssign($event.target.value); $event.target.value = ''" class="select-field" style="min-width: 150px;">
            <option value="">{{ _('assign_to') }}</option>
            {% for user in staff_users %}
            <option value="{{ user.id }}">{{ user.username }}</option>
            {% endfor %}
        </select>
        
        <select @change="$store.kanbanManager.bulkUpdateStatus($event.target.value); $event.target.value = ''" class="select-field" style="min-width: 120px;">
            <option value="">{{ _('status_placeholder') }}</option>
            {% for status in QuoteRequest.StatusEnum %}
            <option value="{{ status.value }}">{{ get_status_display(status) }}</option>
            {% endfor %}
        </select>
                
        <a :href="'/api/export-requests?card_ids=' + $store.kanbanManager.selectedIds.join(',')"
            class="btn btn-sm btn-secondary">
            <i class='bx bx-download'></i> {{ _('export') }}
        </a>
        
        <button @click="$store.kanbanManager.clearSelection()" class="btn-icon btn-icon-danger" title="{{ _('cancel_selection') }}">
            <i class='bx bx-x'></i>
        </button>
    </div>

    <div id="kanban-board-container" 
         hx-get="{{ request.url_for('admin_htmx_kanban_content', locale=request.state.locale) }}?show_archived={{ show_archived }}"
         hx-trigger="load, updateKanban from:body"
         hx-swap="innerHTML">
        <div class="modal-loading-placeholder" style="padding: 100px 0;">
            <i class='bx bx-loader-alt bx-spin'></i><span>{{ _('loading_kanban') }}</span>
        </div>
    </div>
</div>
{% endblock %}
