{% extends "admin/base.html" %}

{% block content %}
<style>
    #main-content { padding: 0 !important; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
</style>

<div x-data>
    <!-- 1. Панель фильтров -->
    <form class="filter-bar" 
          id="kanban-filters-form"
          hx-get="{{ url_for('admin_htmx_kanban_content', locale=request.state.locale) }}"
          hx-target="#kanban-board-container" 
          hx-trigger="input changed delay:300ms, change" 
          hx-push-url="false">

        <!-- Поиск -->
        <div class="search-input-wrapper">
            <i class='bx bx-search'></i>
            <input type="search" name="q" placeholder="{{ _('search_placeholder_general') }}" 
                   class="input-field" value="{{ current_filters.q or '' }}" autocomplete="off">
        </div>
        
        <!-- Выбор менеджера -->
        <div style="width: 200px;">
             <select name="assignee" class="select-field">
                <option value="">{{ _('all_managers') }}</option>
                <option value="me" {% if current_filters.assignee == 'me' %}selected{% endif %}>{{ _('only_my') }}</option>
                {% for manager in staff_users %}
                    <option value="{{ manager.id }}" {% if current_filters.assignee == manager.id|string %}selected{% endif %}>{{ manager.username }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Переключатель Архива -->
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; margin-left: 10px;">
            <input type="checkbox" name="show_archived" value="true" 
                   {% if current_filters.show_archived %}checked{% endif %} 
                   style="width:18px; height:18px; accent-color:var(--primary);">
            <span style="font-size:0.9rem; color:var(--text-main); font-weight: 500;">{{ _('show_archive') }}</span>
        </label>

        <!-- Кнопка Новая заявка -->
        <a href="{{ url_for('admin_quoterequest_add', locale=request.state.locale) }}" 
           class="btn btn-primary" style="margin-left: auto;"
           onclick="htmx.ajax('GET', '{{ url_for('admin_quoterequest_add', locale=request.state.locale) }}', {target:'#modal-body-content'}); openOverlay('modal-overlay'); return false;">
            <i class='bx bx-plus'></i> {{ _('new_request_btn') }}
        </a>
    </form>

    <!-- 2. Контейнер Канбана -->
    <div id="kanban-board-container" class="kanban-container"
         hx-get="{{ url_for('admin_htmx_kanban_content', locale=request.state.locale) }}?{{ request.query_params }}"
         hx-trigger="load, updateKanban from:body"
         hx-swap="innerHTML">
        
        <!-- Заглушка загрузки -->
        <div style="display:flex; justify-content:center; align-items:center; height:100%; color:var(--text-muted);">
            <i class='bx bx-loader-alt bx-spin' style="font-size: 2rem;"></i>
        </div>
    </div>
</div>
{% endblock %}
