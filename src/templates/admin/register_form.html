<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | WeConstruct CRM</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
	<link rel="stylesheet" href="{{ url_for('static', path='css/crm.css') }}">
</head>
<body class="login-page">
    <div class="card login-card" style="max-width: 450px;">
        <div class="login-header">
            <a href="#" class="brand"><i class='bx bxs-user-plus'></i><span>Завершение регистрации</span></a>
            <p>Добро пожаловать! Задайте имя пользователя и пароль для входа в CRM.</p>
        </div>
        <form method="post" novalidate>
            <div class="input-group">
                <label>Приглашение для</label>
                <input type="text" class="input-field" value="{{ note }}" disabled>
            </div>
            {% for field in form %}
            <div class="input-group">
                <label for="{{ field.id }}">{{ field.label.text }}</label>
                {{ field(class_='input-field') }}
                {% if field.errors %}
                <div style="color: var(--status-red); font-size: 0.8rem; margin-top: 4px;">{{ field.errors[0] }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <div style="margin-top: 24px;">
                <button class="btn btn-primary" type="submit" style="width: 100%;">Зарегистрироваться</button>
            </div>
        </form>
    </div>
</body>
</html>
