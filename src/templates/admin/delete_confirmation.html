{% extends "admin/base.html" %}

{% block content %}
<div class="page-header">
    <h1>{{ title }}: {{ original }}</h1>
</div>

<div class="card form-container">
    <p style="margin-bottom: 24px; font-size: 1.1rem;">Вы уверены, что хотите удалить "{{ original }}"? Это действие необратимо.</p>

    <form hx-post="{{ request.url }}" 
          hx-target="body" 
          hx-push-url="true">
        <div class="form-actions">
            <button type="submit" class="btn btn-danger">Да, я уверен</button>
            <a href="{{ back_url }}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
    {# --- КОНЕЦ ИЗМЕНЕНИЯ --- #}
</div>
{% endblock %}
