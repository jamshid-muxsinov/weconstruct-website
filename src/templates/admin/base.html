<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token(request) }}">
    
    <title>{{ title|default("Панель управления") }} | WeConstruct CRM</title>
    
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', path='favicons/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='favicons/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='favicons/favicon-16x16.png') }}">
    <link rel="manifest" href="{{ url_for('static', path='favicons/site.webmanifest') }}">
    <link rel="shortcut icon" href="{{ url_for('static',path='favicons/favicon.ico') }}">
    <meta name="msapplication-TileColor" content="#07385a">
    <meta name="theme-color" content="#ffffff">

    <!-- Styles & Fonts -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
	<link rel="stylesheet" href="{{ url_for('static', path='css/crm.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">

    <!-- Scripts -->
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/sse.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Sidebar collapse handler -->
    <script>
        (function() {
            try {
                if (localStorage.getItem('sidebarCollapsed') === 'true') {
                    document.documentElement.classList.add('sidebar-collapsed-init');
                }
            } catch (e) { console.error('Could not access localStorage for sidebar state.'); }
        })();
    </script>
</head>
<body class="dark" hx-ext="class-tools">
    
    <!-- ГЛАВНЫЙ КОНТЕЙНЕР ПРИЛОЖЕНИЯ -->
    <div id="crm-container">
        
        <!-- БОКОВАЯ ПАНЕЛЬ -->
        <aside id="sidebar">
            <div class="sidebar-header"> 
                <i class='bx bxs-color-fill logo-icon'></i> 
                <span class="logo-text">WeConstruct</span>
                <button id="sidebar-collapse-btn" class="btn-icon"><i class='bx bx-menu'></i></button>
            </div>
            <nav>
                <a href="{{ request.url_for('admin_kanban_board') }}" class="nav-link {% if 'kanban' in request.url.path or request.url.path == '/admin/' %}active{% endif %}"> <i class='bx bxs-grid-alt nav-icon'></i><span class="nav-text">Канбан-доска</span> </a>
                <a href="{{ request.url_for('admin_quoterequest_list') }}" class="nav-link {% if 'quoterequest' in request.url.path %}active{% endif %}"> <i class='bx bx-list-ul nav-icon'></i><span class="nav-text">Заявки</span> </a>
                <a href="{{ request.url_for('admin_product_list') }}" class="nav-link {% if 'product' in request.url.path %}active{% endif %}"> <i class='bx bxs-package nav-icon'></i><span class="nav-text">Товары</span> </a>
                <a href="{{ request.url_for('admin_category_list') }}" class="nav-link {% if 'category' in request.url.path %}active{% endif %}"> <i class='bx bxs-component nav-icon'></i><span class="nav-text">Категории</span> </a>
                <a href="{{ request.url_for('admin_dashboard') }}" class="nav-link {% if 'dashboard' in request.url.path %}active{% endif %}"> <i class='bx bxs-bar-chart-alt-2 nav-icon'></i><span class="nav-text">Статистика</span> </a>
            </nav>
            <div class="sidebar-footer"> 
                <a href="{{ request.url_for('admin_logout') }}" class="logout-trigger nav-link"> <i class='bx bx-log-out nav-icon'></i><span class="nav-text">Выйти</span> </a> 
            </div>
        </aside>
        
        <div id="content-wrapper">
            <header class="main-header">
                <button id="sidebar-expand-btn" class="btn-icon"><i class='bx bx-menu'></i></button>
                
                <!-- Этот div растягивается, чтобы прижать профиль к правому краю -->
                <div class="header-spacer"></div> 

                {% if user %}
                <div class="user-profile" x-data="{ open: false }" @click.away="open = false">
                    <button @click="open = !open" id="profile-menu-button" class="user-profile-button">
                        <span class="profile-name">Привет, {{ user.username }}!</span>
                        <div id="notification-indicator-wrapper" 
                            hx-get="{{ request.url_for('admin_htmx_notification_indicator') }}"
                            hx-trigger="load, every 8s, notifications-read from:body"
                            hx-swap="innerHTML"
                            hx-on::after-request="
                                const currentCount = this.querySelector('#notification-counter')?.textContent || '0';
                                const prevCount = this.prevCount || '0';
                                if (parseInt(currentCount) > parseInt(prevCount)) {
                                    htmx.trigger('#kanban-board-container', 'updateKanban');
                                }
                                this.prevCount = currentCount;
                            ">
                            {% include "admin/partials/_notification_indicator.html" %}
                        </div>
                        <i class='bx bx-chevron-down' :class="{'bx-rotate-180': open}"></i>
                    </button>

                    <div x-show="open" x-transition id="profile-menu">
                        <div id="notifications-container"
                             hx-get="{{ request.url_for('admin_htmx_notifications') }}"
                             hx-trigger="load, click from:#profile-menu-button"
                             hx-swap="innerHTML">
                             <div class="modal-loading-placeholder"><i class='bx bx-loader-alt bx-spin'></i></div>
                        </div>
                        
                        <ul class="profile-menu-list">
                            <li><a href="{{ request.url_for('admin_profile') }}" class="profile-menu-link"><i class='bx bxs-user-circle'></i><span>Профиль</span></a></li>
                            <li><a href="{{ request.url_for('admin_invites') }}" class="profile-menu-link"><i class='bx bxs-paper-plane'></i><span>Приглашения</span></a></li>
                            <li><hr class="menu-divider"></li>
                            <li><a href="{{ request.url_for('admin_logout') }}" class="profile-menu-link logout"><i class='bx bx-log-out'></i><span>Выйти</span></a></li>
                        </ul>
                    </div>
                </div>
                {% endif %}
            </header>
            
            <main> 
                {% block content %}{% endblock %} 
            </main>
        </div>

    </div>
    
    <div id="modal-overlay" class="modal-overlay">
        <div id="modal-body-content" class="modal-content"><div class="modal-loading-placeholder"><i class='bx bx-loader-alt bx-spin'></i><span>Загрузка...</span></div></div>
    </div>
    
    <div id="slide-over-overlay" class="slide-over-overlay">
        <div id="slide-over-panel" class="slide-over-panel">
            <div id="slide-over-content"><div class="modal-loading-placeholder"><i class='bx bx-loader-alt bx-spin'></i><span>Загрузка...</span></div></div>
        </div>
    </div>

	<script src="{{ url_for('static', path='js/crm.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const notyf = new Notyf({ duration: 4000, position: { x: 'right', y: 'top' }, dismissible: true });
            document.body.addEventListener('show-toast', e => {
                notyf.open({ type: e.detail.type || 'success', message: e.detail.message || 'Сохранено!' });
            });
        });
    </script>
</body>
</html>
