<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="csrf-token" content="{{ csrf_token(request) }}">
    <meta name="current-user-id" content="{{ user.id if user else '' }}">
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WeConstruct CRM">
    <link rel="manifest" href="{{ url_for('static', path='manifest.json') }}">
    
    
    <title>{{ title|default("Панель управления") }} | WeConstruct CRM</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', path='favicons/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='favicons/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='favicons/favicon-16x16.png') }}">
    <link rel="manifest" href="{{ url_for('static', path='favicons/site.webmanifest') }}">
    <link rel="shortcut icon" href="{{ url_for('static',path='favicons/favicon.ico') }}">
    <meta name="msapplication-TileColor" content="#07385a">
    <meta name="theme-color" content="#ffffff">

    <!-- Enhanced Styles & Fonts -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="{{ url_for('static', path='css/crm.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/crm-enhanced.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
    
    <!-- Flatpickr (календарь для выбора дат) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <!-- Scripts -->
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/sse.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
</head>

<body class="dark" hx-ext="class-tools">
    
    <div id="crm-container">
        
        <aside id="sidebar">
            <div class="sidebar-header"> 
                <i class='bx bxs-color-fill logo-icon'></i> 
                <span class="logo-text">WeConstruct</span>
            </div>
            <nav id="sidebar-nav"> <!-- *** ИЗМЕНЕНИЕ: Добавлен ID для навигации *** -->
                <!-- *** ИЗМЕНЕНИЕ: Добавлены атрибуты hx-target и hx-push-url к ссылкам *** -->
                <a href="{{ request.url_for('admin_kanban_board') }}" class="nav-link {% if 'kanban' in request.url.path or request.url.path == '/' %}active{% endif %}" hx-get="{{ request.url_for('admin_kanban_board') }}" hx-target="#main-content" hx-push-url="true"> <i class='bx bxs-grid-alt nav-icon'></i><span class="nav-text">Канбан-доска</span> </a>
                <a href="{{ request.url_for('admin_quoterequest_list') }}" class="nav-link {% if 'quoterequest' in request.url.path %}active{% endif %}" hx-get="{{ request.url_for('admin_quoterequest_list') }}" hx-target="#main-content" hx-push-url="true"> <i class='bx bx-list-ul nav-icon'></i><span class="nav-text">Заявки</span> </a>
                <a href="{{ request.url_for('admin_product_list') }}" class="nav-link {% if 'product' in request.url.path %}active{% endif %}" hx-get="{{ request.url_for('admin_product_list') }}" hx-target="#main-content" hx-push-url="true"> <i class='bx bxs-package nav-icon'></i><span class="nav-text">Товары</span> </a>
                <a href="{{ request.url_for('admin_category_list') }}" class="nav-link {% if 'category' in request.url.path %}active{% endif %}" hx-get="{{ request.url_for('admin_category_list') }}" hx-target="#main-content" hx-push-url="true"> <i class='bx bxs-component nav-icon'></i><span class="nav-text">Категории</span> </a>
                <a href="{{ request.url_for('admin_dashboard') }}" class="nav-link {% if 'dashboard' in request.url.path %}active{% endif %}" hx-get="{{ request.url_for('admin_dashboard') }}" hx-target="#main-content" hx-push-url="true"> <i class='bx bxs-bar-chart-alt-2 nav-icon'></i><span class="nav-text">Статистика</span> </a>
                <a href="{{ request.url_for('admin_import_page') }}" class="nav-link {% if request.url.path.startswith('/import') %} active {% endif %}" hx-get="{{ request.url_for('admin_import_page') }}" hx-target="#main-content" hx-push-url="true">
                    <svg class="w-6 h-6 nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"></path></svg>
                    <span class="nav-text">Импорт</span>
                </a>
            </nav>
            <div class="sidebar-footer"> 
                <a href="{{ request.url_for('admin_logout') }}" class="logout-trigger nav-link"> <i class='bx bx-log-out nav-icon'></i><span class="nav-text">Выйти</span> </a> 
            </div>
        </aside>
        
        <div id="content-wrapper">
            <header class="main-header">
                <button id="sidebar-expand-btn" class="btn-icon"><i class='bx bx-menu'></i></button>
                
                <div class="header-spacer"></div> 

                {% if user %}
                <div class="user-profile" x-data="{ open: false }" @click.away="open = false">
                    <button @click="open = !open" id="profile-menu-button" class="user-profile-button">
                        <span class="profile-name">Привет, {{ user.username }}!</span>
                        <div id="notification-indicator-wrapper" 
                            hx-get="{{ request.url_for('admin_htmx_notification_indicator') }}"
                            hx-trigger="load, every 8s, notifications-read from:body"
                            hx-swap="innerHTML">
                            {% include "admin/partials/_notification_indicator.html" %}
                        </div>
                        <i class='bx bx-chevron-down' :class="{'bx-rotate-180': open}"></i>
                    </button>

                    <div x-show="open" x-transition:enter="transition ease-out duration-200"
                         x-transition:enter-start="opacity-0 transform scale-95"
                         x-transition:enter-end="opacity-100 transform scale-100"
                         x-transition:leave="transition ease-in duration-150"
                         x-transition:leave-start="opacity-100 transform scale-100"
                         x-transition:leave-end="opacity-0 transform scale-95"
                         id="profile-menu" 
                         style="display: none;">
                        <div id="notifications-container"
                             hx-get="{{ request.url_for('admin_htmx_notifications') }}"
                             hx-trigger="load, click from:#profile-menu-button"
                             hx-swap="innerHTML">
                             <div class="modal-loading-placeholder"><i class='bx bx-loader-alt bx-spin'></i></div>
                        </div>
                        
                        <ul class="profile-menu-list">
                            <li><a href="{{ request.url_for('admin_profile') }}" class="profile-menu-link" hx-get="{{ request.url_for('admin_profile') }}" hx-target="#main-content" hx-push-url="true"><i class='bx bxs-user-circle'></i><span>Профиль</span></a></li>
                            <li><a href="{{ request.url_for('admin_invites') }}" class="profile-menu-link" hx-get="{{ request.url_for('admin_invites') }}" hx-target="#main-content" hx-push-url="true"><i class='bx bxs-paper-plane'></i><span>Приглашения</span></a></li>
                            <li><hr class="menu-divider"></li>
                            <li><a href="{{ request.url_for('admin_logout') }}" class="profile-menu-link logout logout-trigger"><i class='bx bx-log-out'></i><span>Выйти</span></a></li>
                        </ul>
                    </div>
                </div>
                {% endif %}
            </header>
            
            <!-- *** ИЗМЕНЕНИЕ: Обернули контент в ID, на который будут ссылаться ссылки *** -->
            <main id="main-content"> 
                {% block content %}{% endblock %} 
            </main>
        </div>

    </div>
    
    <div id="modal-overlay" class="modal-overlay">
        <div id="modal-body-content" class="modal-content"><div class="modal-loading-placeholder"><i class='bx bx-loader-alt bx-spin'></i><span>Загрузка...</span></div></div>
    </div>
    
    <div id="slide-over-overlay" class="slide-over-overlay">
        <div id="slide-over-panel" class="slide-over-panel">
            <div id="slide-over-content"><div class="modal-loading-placeholder"><i class='bx bx-loader-alt bx-spin'></i><span>Загрузка...</span></div></div>
        </div>
    </div>

	<script src="{{ url_for('static', path='js/crm.js') }}"></script>
    <script src="{{ url_for('static', path='js/kanban-enhanced.js') }}"></script>
</body>
</html>
