{# /src/templates/admin/partials/_contact_search_results.html #}

{% for contact in contacts %}
<div class="search-result-item" 
     style="padding: 12px 15px; border-bottom: 1px solid var(--border-color); cursor: pointer;"
     onclick="selectContact('{{ contact.id }}', '{{ contact.full_name }} ({{ contact.phone }})')">
    <div style="font-weight: 600; color: var(--text-main);">{{ contact.full_name }}</div>
    <div style="font-size: 0.85rem; color: var(--text-secondary);">{{ contact.phone }}</div>
</div>
{% else %}
<div class="search-no-results" style="padding: 20px; text-align: center; background: rgba(255,255,255,0.02);">
    <p style="margin-bottom: 15px; color: var(--text-secondary);">Клиент не найден в базе</p>
    <button type="button" class="btn btn-success" 
            style="width: 100%; padding: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;" 
            onclick="showNewContactForm()">
        <i class='bx bx-user-plus'></i> Создать нового клиента
    </button>
</div>
{% endfor %}
