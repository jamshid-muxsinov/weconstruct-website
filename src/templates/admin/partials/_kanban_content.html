<div class="kanban-board">
    {% for column in requests_by_status %}
    <div class="kanban-column" data-status="{{ column.status_code }}">
        <div class="kanban-column-header">
            <span>{{ get_status_display(column.status_code) }}</span>
            <span class="kanban-count-badge">{{ column.requests|length }}</span>
        </div>
        <div class="kanban-column-body">
            {% for req in column.requests %}
                {% include "admin/partials/_kanban_card.html" %}
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</div>

<script>
    if (window.initKanbanSortable) {
        window.initKanbanSortable();
    }
    if (window.Alpine && Alpine.store('kanbanManager')) {
        Alpine.store('kanbanManager').clearSelection();
    }
</script>
