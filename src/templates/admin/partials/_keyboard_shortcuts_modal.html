{# Keyboard Shortcuts Help Modal #}
<div class="modal-content" style="max-width: 600px;">
    <div class="modal-header">
        <h2><i class='bx bx-keyboard'></i> Горячие клавиши</h2>
        <button class="modal-close">&times;</button>
    </div>
    <div class="modal-body">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px;">
            <div>
                <h3 style="font-size: 1.1rem; font-weight: 600; color: var(--accent-primary); margin-bottom: 12px;">Навигация</h3>
                <ul style="list-style: none; display: flex; flex-direction: column; gap: 12px;">
                    <li style="display: flex; align-items: center; gap: 10px;"><kbd>G</kbd> + <kbd>K</kbd> <span>Перейти к Kanban</span></li>
                    <li style="display: flex; align-items: center; gap: 10px;"><kbd>G</kbd> + <kbd>D</kbd> <span>Перейти к Статистике</span></li>
                    <li style="display: flex; align-items: center; gap: 10px;"><kbd>G</kbd> + <kbd>L</kbd> <span>Перейти к Списку заявок</span></li>
                </ul>
            </div>
            <div>
                <h3 style="font-size: 1.1rem; font-weight: 600; color: var(--accent-primary); margin-bottom: 12px;">Общие</h3>
                <ul style="list-style: none; display: flex; flex-direction: column; gap: 12px;">
                    <li style="display: flex; align-items: center; gap: 10px;"><kbd>?</kbd> <span>Показать эту справку</span></li>
                    <li style="display: flex; align-items: center; gap: 10px;"><kbd>/</kbd> <span>Фокус на поиске</span></li>
                    <li style="display: flex; align-items: center; gap: 10px;"><kbd>Esc</kbd> <span>Закрыть окно / Отменить</span></li>
                </ul>
            </div>
        </div>
    </div>
</div>
<style>
    kbd {
        background: var(--surface-2);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 4px 8px;
        font-family: monospace;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-primary);
    }
</style>
