{# /src/templates/admin/partials/_notification_indicator.html #}
<i class='bx bxs-user-circle' style="font-size: 2rem;"></i>
{% if unread_notifications_count > 0 %}
<span id="notification-counter" style="position: absolute; top: -2px; right: -2px; width: 18px; height: 18px; background-color: var(--status-red); color: white; border-radius: 50%; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 2px solid var(--surface-1);">
    {{ unread_notifications_count }}
</span>
{% endif %}
