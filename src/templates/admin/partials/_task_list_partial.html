<div class="task-list">
    {% for task in tasks %}
    <div class="task-item">
        <input type="checkbox" class="task-checkbox"
               hx-post="{{ request.url_for('admin_htmx_toggle_task', locale=request.state.locale, pk=task.id) }}"
               hx-target=".task-list-container"
               hx-swap="innerHTML"
               {% if task.completed %}checked{% endif %}>
        
        <span class="task-text {% if task.completed %}done{% endif %}">
            {{ task.title }}
        </span>
        
        <span style="font-size:0.7rem; color:var(--text-muted);">
            {{ task.assigned_to.username if task.assigned_to else '' }}
        </span>
    </div>
    {% else %}
    <div style="padding: 16px; text-align: center; color: var(--text-muted); font-size: 0.85rem; font-style: italic;">
        Нет задач по этой заявке
    </div>
    {% endfor %}
</div>
