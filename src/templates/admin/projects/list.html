{% extends "admin/base.html" %}

{% block content %}
<div style="display: flex; flex-direction: column; height: 100vh; overflow: hidden;">
    
    <!-- 1. ПАНЕЛЬ ФИЛЬТРОВ -->
    <form class="filter-bar" 
          hx-get="{{ request.url_for('admin_project_list', locale=request.state.locale) }}" 
          hx-target="#project-grid-container" 
          hx-trigger="keyup changed delay:300ms from:input, change from:select"
          hx-push-url="true"
          style="flex-shrink: 0; background: white; padding: 16px 32px; border-bottom: 1px solid var(--border-light); display: flex; gap: 16px; align-items: center;">

        <!-- Поиск -->
        <div class="search-input-wrapper" style="width: 300px; position: relative;">
            <i class='bx bx-search' style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
            <input type="search" name="q" placeholder="{{ _('search_project_placeholder') }}" 
                   class="input-field" 
                   value="{{ request.query_params.get('q', '') }}" 
                   autocomplete="off"
                   style="padding-left: 36px;">
        </div>

        <!-- Фильтр по статусу (ПЕРЕВЕДЕНО) -->
        <div style="width: 200px;">
            <select name="status" class="select-field">
                <option value="">{{ _('all_statuses') }}</option>
                {% for status_code in ['design', 'procurement', 'construction', 'finishing', 'handover', 'completed', 'hold'] %}
                    <option value="{{ status_code }}" {% if request.query_params.get('status') == status_code %}selected{% endif %}>
                         {{ get_status_display(status_code) }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Фильтр по менеджеру (для админов) -->
        {% if user.is_superuser %}
        <div style="width: 200px;">
            <select name="manager_id" class="select-field">
                <option value="">{{ _('all_managers') }}</option>
                {% for u in staff_users %}
                <option value="{{ u.id }}" {% if request.query_params.get('manager_id') == u.id|string %}selected{% endif %}>{{ u.username }}</option>
                {% endfor %}
            </select>
        </div>
        {% endif %}

    </form>

    <!-- 2. СЕТКА ПРОЕКТОВ -->
    <div style="flex: 1; overflow-y: auto; background: var(--bg-body);">
        {% include "admin/partials/_project_list_content.html" %}
    </div>

</div>
{% endblock %}
