# nginx/nginx.conf

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Внутренний адрес нашего FastAPI приложения
    upstream web_app {
        server web:8000;
    }

    # Сервер для редиректа с HTTP на HTTPS (для всех доменов)
    server {
        listen 80;
        server_name weconstruct.uz www.weconstruct.uz admin.weconstruct.uz;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Сервер для основного сайта: weconstruct.uz
    server {
        listen 443 ssl http2;
        server_name weconstruct.uz www.weconstruct.uz;

        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;
        
        location / {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Сервер для админ-панели: admin.weconstruct.uz
    server {
        listen 443 ssl http2;
        server_name admin.weconstruct.uz;

        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;
        
        # Запросы к статике и медиафайлам отдаем напрямую, без префикса /admin
        location /static/ {
            proxy_pass http://web_app/static/;
        }
        location /media/ {
            proxy_pass http://web_app/media/;
        }

        # Все остальные запросы (/, /login, /dashboard и т.д.)
        location / {
            # 1. Добавляем префикс /admin и передаем приложению
            # Например, /login -> /admin/login
            proxy_pass http://web_app/admin/;
            
            # 2. Включаем замену в ответах: убираем /admin/ из ссылок
            # Например, href="/admin/dashboard" -> href="/dashboard"
            sub_filter '/admin/' '/';
            sub_filter_once off;

            # Важно, чтобы sub_filter мог работать
            proxy_set_header Accept-Encoding "";
            
            # Стандартные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Для редиректов
            proxy_redirect http://web_app/admin/ /;
        }
    }
}