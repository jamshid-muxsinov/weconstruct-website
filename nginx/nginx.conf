user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    
    client_max_body_size 10M;

    # --- РЕДИРЕКТ С HTTP НА HTTPS ---
    server {
        listen 80;
        server_name weconstruct.uz www.weconstruct.uz admin.weconstruct.uz;
        return 301 https://$host$request_uri;
    }

    # --- ЕДИНЫЙ СЕРВЕР ДЛЯ ОБОИХ ДОМЕНОВ ---
    server {
        listen 443 ssl http2;
        server_name weconstruct.uz www.weconstruct.uz admin.weconstruct.uz;

        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;

        resolver 127.0.0.11 valid=30s;
    

        # --- ОБЩАЯ ОБРАБОТКА СТАТИКИ И МЕДИА ---
        # Nginx будет обрабатывать эти запросы сам, не передавая их в FastAPI
        location /static/ {
            alias /app/src/static/;
            expires 1d;
            access_log off;
        }
        location /media/ {
            alias /app/media/;
            expires 1d;
            access_log off;
        }

        # --- ГЛАВНАЯ ЛОГИКА МАРШРУТИЗАЦИИ ---
        location / {
            # Переменная для хранения имени upstream
            set $upstream_service "";

            # Выбираем upstream в зависимости от домена
            if ($host = 'admin.weconstruct.uz') {
                set $upstream_service http://admin:8000;
            }
            if ($host ~* ^(www\.)?weconstruct\.uz$) {
                set $upstream_service http://site:8000;
            }
            
            # Если upstream не был выбран (на всякий случай), отправляем на основной сайт
            if ($upstream_service = "") {
                set $upstream_service http://site:8000;
            }

            # Устанавливаем заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Отправляем запрос в выбранный upstream
            proxy_pass $upstream_service;
        }
    }
}