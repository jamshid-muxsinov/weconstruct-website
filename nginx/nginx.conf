# --- Глобальные настройки Nginx ---
user nginx;
worker_processes auto; # Автоматически определяет количество ядер процессора
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # --- Базовые HTTP-настройки ---
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    tcp_nopush    on;

    # --- Оптимизация: Gzip-сжатие ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # --- Оптимизация: Upstream-блоки для FastAPI-приложений ---
    # Позволяет использовать keep-alive соединения для лучшей производительности
    upstream site_app {
        server site:8000;
        keepalive 16;
    }

    upstream admin_app {
        server admin:8000;
        keepalive 16;
    }

    # --- ПЕРЕАДРЕСАЦИЯ С HTTP НА HTTPS (ПРАВИЛЬНЫЙ СПОСОБ) ---

    # Сервер для основного сайта, порт 80
    server {
        listen 80;
        server_name weconstruct.uz www.weconstruct.uz;
        return 301 https://$host$request_uri;
    }

    # Сервер для админки, порт 80
    server {
        listen 80;
        server_name admin.weconstruct.uz;
        return 301 https://$host$request_uri;
    }

    # --- СЕРВЕР ДЛЯ ОСНОВНОГО САЙТА (weconstruct.uz) ---
    server {
        listen 443 ssl http2;
        server_name weconstruct.uz www.weconstruct.uz;

        # --- Настройки безопасности SSL/TLS ---
        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
        ssl_ecdh_curve secp384r1;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        
        resolver 127.0.0.11 valid=30s;
    
        # Раздача статики напрямую через Nginx
        location /static/ {
            alias /app/src/static/;
            expires 7d;
            access_log off;
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
            access_log off;
        }

        # Проксирование всех остальных запросов на FastAPI-приложение сайта
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://site_app;
        }
    }

    # --- СЕРВЕР ДЛЯ АДМИНКИ (admin.weconstruct.uz) ---
    server {
        listen 443 ssl http2;
        server_name admin.weconstruct.uz;

        # =================================================================
        # === ГЛАВНОЕ ИСПРАВЛЕНИЕ: УВЕЛИЧЕНИЕ ЛИМИТА РАЗМЕРА ЗАПРОСА ======
        # =================================================================
        client_max_body_size 50M; # Позволяет загружать файлы до 50 МБ

        # --- Настройки безопасности SSL/TLS (аналогично основному сайту) ---
        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
        ssl_ecdh_curve secp384r1;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        resolver 127.0.0.11 valid=30s;

        # Раздача статики и медиа
        location /static/ {
            alias /app/src/static/;
            expires 7d;
            access_log off;
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
            access_log off;
        }
        
        # Проксирование всех остальных запросов на FastAPI-приложение админки
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://admin_app;
        }
    }
}