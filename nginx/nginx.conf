user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    upstream web_app {
        server web:8000;
    }

    # ==========================================================
    # HTTP (порт 80)
    # ==========================================================

    # Основной домен (weconstruct.uz)
    server {
        listen 80;
        server_name weconstruct.uz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://weconstruct.uz$request_uri;
        }
    }

    # Редирект с www -> основной домен
    server {
        listen 80;
        server_name www.weconstruct.uz;
        return 301 https://weconstruct.uz$request_uri;
    }

    # ==========================================================
    # HTTPS (порт 443)
    # ==========================================================

    # Основной домен (weconstruct.uz)
    server {
        listen 443 ssl http2;
        server_name weconstruct.uz;

        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;

        # Статика
        location /static/ {
            root /app/src;
            expires 1d;
            access_log off;
            add_header Cache-Control "public";
        }

        # Медиа
        location /media/ {
            root /app;
            expires 1d;
            access_log off;
            add_header Cache-Control "public";
        }

        # Все остальные запросы -> бэкенд
        location / {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Редирект HTTPS с www -> основной домен
    server {
        listen 443 ssl http2;
        server_name www.weconstruct.uz;

        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;

        return 301 https://weconstruct.uz$request_uri;
    }
}
