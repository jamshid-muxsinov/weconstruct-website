user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Внутренний адрес вашего FastAPI приложения
    upstream web_app {
        server web:8000;
    }

    # Сервер для основного сайта weconstruct.uz
    server {
        listen 443 ssl http2;
        server_name weconstruct.uz www.weconstruct.uz;

        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;
        
        # Все запросы к основному сайту просто перенаправляются в приложение
        location / {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- НОВАЯ, ИСПРАВЛЕННАЯ КОНФИГУРАЦИЯ ДЛЯ АДМИНКИ ---
    server {
        listen 443 ssl http2;
        server_name admin.weconstruct.uz;

        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;
        
        # Этот блок обрабатывает запросы к статике и медиафайлам.
        # Он НЕ добавляет префикс /admin/, так как FastAPI ожидает их по путям /static/... и /media/...
        location ~ ^/(static|media)/ {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Этот блок обрабатывает ВСЕ ОСТАЛЬНЫЕ запросы (к самому приложению).
        location / {
            # КЛЮЧЕВОЕ ИЗМЕНЕНИЕ: Добавляем префикс /admin/ к запросу.
            # Слэш в конце "http://web_app/admin/" — это самое важное!
            proxy_pass http://web_app/admin/;
            
            # Эта директива нужна, чтобы если FastAPI вернет редирект на /admin/login,
            # Nginx правильно "отрежет" /admin/ и вернет пользователю /login
            proxy_redirect /admin/ /;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Этот сервер нужен для редиректа с HTTP на HTTPS и для Let's Encrypt
    server {
        listen 80;
        server_name weconstruct.uz www.weconstruct.uz admin.weconstruct.uz;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }
}