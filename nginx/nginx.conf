user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    
    client_max_body_size 10M;

    # Определяем два разных "пула" серверов.
    # Один для сайта, другой для админки.
    upstream upstream_site {
        server site:8000;
    }
    upstream upstream_admin {
        server admin:8000;
    }

    # Этот сервер ловит ВСЕ запросы на порт 80
    # и принудительно перенаправляет их на HTTPS.
    server {
        listen 80;
        server_name weconstruct.uz www.weconstruct.uz admin.weconstruct.uz;
        return 301 https://$host$request_uri;
    }

    # --- КОНФИГУРАЦИЯ ДЛЯ ОСНОВНОГО САЙТА ---
    server {
        listen 443 ssl http2;
        # Этот блок сработает ТОЛЬКО для этих доменов:
        server_name weconstruct.uz www.weconstruct.uz;

        # Настройки SSL
        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;
        
        # Перенаправляем трафик в контейнер 'site'
        location / {
            proxy_pass http://upstream_site;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Отдаем статику напрямую через Nginx (быстрее)
        location /static/ { alias /app/src/static/; }
        location /media/ { alias /app/media/; }
    }

    # --- КОНФИГУРАЦИЯ ДЛЯ АДМИНКИ ---
    server {
        listen 443 ssl http2;
        # Этот блок сработает ТОЛЬКО для этого домена:
        server_name admin.weconstruct.uz;

        # Настройки SSL (используем тот же сертификат)
        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;
       
        # Перенаправляем трафик в контейнер 'admin'
        location / {
            proxy_pass http://upstream_admin; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Отдаем статику напрямую через Nginx
        location /static/ { alias /app/src/static/; }
        location /media/ { alias /app/media/; }
    }
}