user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    
    client_max_body_size 10M;

    # Определяем пулы серверов (без изменений)
    upstream upstream_site {
        server site:8000;
    }
    upstream upstream_admin {
        server admin:8000;
    }

    # Сервер для редиректа с HTTP на HTTPS (без изменений)
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # <<< НАЧАЛО ГЛАВНОГО ИЗМЕНЕНИЯ >>>
    # ЕДИНЫЙ сервер для обработки SSL-трафика для ВСЕХ доменов
    server {
        listen 443 ssl http2;
        
        # Указываем все домены, которые обслуживает этот сервер
        server_name weconstruct.uz www.weconstruct.uz admin.weconstruct.uz;

        # SSL-сертификаты (остаются те же)
        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;
        
        # Общие заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Главная логика маршрутизации
        location / {
            # Используем переменную $host, чтобы определить, куда направить запрос
            if ($host = 'admin.weconstruct.uz') {
                proxy_pass http://upstream_admin;
            }
            if ($host ~* ^(www\.)?weconstruct\.uz$) {
                proxy_pass http://upstream_site;
            }
        }

        # Обработка статики и медиа (важно для производительности)
        location /static/ {
            alias /app/src/static/;
            expires 30d;
            access_log off;
        }

        location /media/ {
            alias /app/media/;
            expires 30d;
            access_log off;
        }
    }
    # <<< КОНЕЦ ГЛАВНОГО ИЗМЕНЕНИЯ >>>
}