user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    
    client_max_body_size 10M;

    # Определяем пулы серверов (upstream)
    upstream upstream_site {
        server site:8000;
    }
    upstream upstream_admin {
        server admin:8000;
    }

    # --- СЕРВЕР ДЛЯ РЕДИРЕКТА С HTTP НА HTTPS ---
    server {
        listen 80;
        server_name weconstruct.uz www.weconstruct.uz admin.weconstruct.uz;
        return 301 https://$host$request_uri;
    }

    # --- СЕРВЕР ДЛЯ ОСНОВНОГО САЙТА: weconstruct.uz ---
    server {
        listen 443 ssl http2 default_server;

        # Этот блок будет работать ТОЛЬКО для этих доменных имен
        server_name weconstruct.uz www.weconstruct.uz;

        # Пути к вашим SSL-сертификатам
        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;

        # Настройки безопасности для SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_dhparam /etc/ssl/certs/dhparam.pem;  # Используйте свой dhparam.pem, если это необходимо.

        # HTTP Strict Transport Security (HSTS)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Общие настройки для всех запросов
        location / {
            proxy_pass http://upstream_site;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- СЕРВЕР ДЛЯ АДМИНКИ: admin.weconstruct.uz ---
    server {
        listen 443 ssl http2;

        # Этот блок будет работать ТОЛЬКО для этого доменного имени
        server_name admin.weconstruct.uz;

        # Используем те же SSL-сертификаты
        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;

        # Настройки безопасности для SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_dhparam /etc/ssl/certs/dhparam.pem;  # Используйте свой dhparam.pem, если это необходимо.

        # HTTP Strict Transport Security (HSTS)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Общие настройки для всех запросов
        location / {
            proxy_pass http://upstream_admin; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- ОШИБКИ И ОШИБКИ ПО ИЗБРАННЫМ ПУТЯМ ---
    error_page 497 https://$host$request_uri;  # Обработка ошибки 497 (использование HTTP вместо HTTPS)
}
