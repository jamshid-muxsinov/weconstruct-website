user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    
    client_max_body_size 10M;

    # --- ПУЛЫ СЕРВЕРОВ (UPSTREAMS) ---
    upstream upstream_site {
        server site:8000;
    }
    upstream upstream_admin {
        server admin:8000;
    }

    # --- РЕДИРЕКТ С HTTP НА HTTPS ---
    # Этот блок ловит ВЕСЬ трафик на порт 80 и отправляет на HTTPS-версию
    server {
        listen 80;
        server_name weconstruct.uz www.weconstruct.uz admin.weconstruct.uz;
        return 301 https://$host$request_uri;
    }

    # --- СЕРВЕР ДЛЯ ОСНОВНОГО САЙТА ---
    server {
        # Слушаем порт 443 и включаем SSL
        listen 443 ssl http2;
        
        # Этот блок сработает ТОЛЬКО для этих доменных имен
        server_name weconstruct.uz www.weconstruct.uz;

        # Пути к вашим SSL-сертификатам
        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;
        
        # Перенаправляем запрос в контейнер `site`
        location / {
            proxy_pass http://upstream_site;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- СЕРВЕР ДЛЯ АДМИНКИ ---
    server {
        # Слушаем порт 443 и включаем SSL
        listen 443 ssl http2;
        
        # Этот блок сработает ТОЛЬКО для этого доменного имени
        server_name admin.weconstruct.uz;

        # Используем те же SSL-сертификаты
        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;
       
        # Перенаправляем запрос в контейнер `admin`
        location / {
            proxy_pass http://upstream_admin; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}