user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    tcp_nopush    on;
    client_max_body_size 10M;

    # --- СЕРВЕР ДЛЯ ОСНОВНОГО САЙТА (weconstruct.uz) ---
    server {
        listen 80;
        listen 443 ssl http2;
        server_name weconstruct.uz www.weconstruct.uz;

        if ($scheme = http) {
            return 301 https://$host$request_uri;
        }

        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;

        resolver 127.0.0.11 valid=30s;
    
        location /static/ {
            alias /app/src/static/;
            expires 1d;
            access_log off;
        }

        location /media/ {
            alias /app/media/;
            expires 1d;
            access_log off;
        }

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://site:8000;
        }
    }

    # --- СЕРВЕР ДЛЯ АДМИНКИ (admin.weconstruct.uz) ---
    server {
        listen 80;
        listen 443 ssl http2;
        server_name admin.weconstruct.uz;

        if ($scheme = http) {
            return 301 https://$host$request_uri;
        }

        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;

        resolver 127.0.0.11 valid=30s;

        location /static/ {
            alias /app/src/static/;
            expires 1d;
            access_log off;
        }

        location /media/ {
            alias /app/media/;
            expires 1d;
            access_log off;
        }
        
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # <<< ИЗМЕНЕНИЕ: Убираем /admin/ отсюда >>>
            proxy_pass http://admin:8000;
        }
    }
}