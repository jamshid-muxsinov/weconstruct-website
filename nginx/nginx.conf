user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    upstream web_app {
        server web:8000;
    }

    # ==========================================================
    # HTTP (порт 80)
    # ==========================================================

    # Основной домен (weconstruct.uz)
    server {
        listen 80;
        server_name weconstruct.uz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://weconstruct.uz$request_uri;
        }
    }

    # Редирект с www -> основной домен
    server {
        listen 80;
        server_name www.weconstruct.uz;
        return 301 https://weconstruct.uz$request_uri;
    }

    # Admin subdomain (admin.weconstruct.uz) - HTTP redirect to HTTPS
    server {
        listen 80;
        server_name admin.weconstruct.uz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://admin.weconstruct.uz$request_uri;
        }
    }

    # ==========================================================
    # HTTPS (порт 443)
    # ==========================================================

    # Основной домен (weconstruct.uz)
    server {
        listen 443 ssl http2;
        server_name weconstruct.uz;

        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256;
        ssl_prefer_server_ciphers off;

        # Статикаs
        location /static/ {
            root /app/src;
            expires 1d;
            access_log off;
            add_header Cache-Control "public";
        }

        # Медиа
        location /media/ {
            root /app;
            expires 1d;
            access_log off;
            add_header Cache-Control "public";
        }

        # Все остальные запросы -> бэкенд
        location / {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Original-URI $request_uri;
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # Редирект HTTPS с www -> основной домен
    server {
        listen 443 ssl http2;
        server_name www.weconstruct.uz;

        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;

        return 301 https://weconstruct.uz$request_uri;
    }

    # Admin subdomain (admin.weconstruct.uz) - HTTPS
    server {
        listen 443 ssl http2;
        server_name admin.weconstruct.uz;

        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256;
        ssl_prefer_server_ciphers off;

        # Static files
        location /static/ {
            root /app/src;
            expires 1d;
            access_log off;
            add_header Cache-Control "public";
        }

        # Media files
        location /media/ {
            root /app;
            expires 1d;
            access_log off;
            add_header Cache-Control "public";
        }

        # Redirect root to admin
        location = / {
            return 301 https://admin.weconstruct.uz/admin/;
        }

        # All admin requests -> backend with /admin prefix
        location / {
            # Ensure the path starts with /admin
            if ($uri !~ ^/admin) {
                return 301 https://admin.weconstruct.uz/admin$uri;
            }
            
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Original-URI $request_uri;
            
            # WebSocket support (for potential future use)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
