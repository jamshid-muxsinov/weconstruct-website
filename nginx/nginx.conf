user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    upstream web_app {
        server web:8000;
    }
    
    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name weconstruct.uz www.weconstruct.uz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name weconstruct.uz www.weconstruct.uz;

        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;
        
        # ==========================================================
        # ФИНАЛЬНОЕ ИСПРАВЛЕНИЕ:
        # Указываем Nginx, что корневая папка для статики - это /app/src
        # ==========================================================
        
        location /static/ {
            root /app/src; # Говорим: ищи папку 'static' внутри '/app/src'
            
            expires 1d;
            access_log off;
            add_header Cache-Control "public";
        }

        location /media/ {
            root /app; # Говорим: ищи папку 'media' внутри '/app'
            
            expires 1d;
            access_log off;
            add_header Cache-Control "public";
        }

        # ==========================================================
        # Все остальные запросы отправляются на бэкенд
        # ==========================================================
        location / {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}