# --- Глобальные настройки Nginx ---
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # --- Базовые HTTP-настройки ---
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    tcp_nopush    on;

    # --- Оптимизация: Gzip-сжатие ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # --- Оптимизация: Upstream-блоки для FastAPI-приложений ---
    upstream site_app {
        server site:8000;
        keepalive 16;
    }

    upstream admin_app {
        server admin:8000;
        keepalive 16;
    }

    # --- Переадресация с HTTP на HTTPS ---
    server {
        listen 80;
        server_name weconstruct.uz www.weconstruct.uz admin.weconstruct.uz;
        return 301 https://$host$request_uri;
    }

    # --- СЕРВЕР ДЛЯ ОСНОВНОГО САЙТА (weconstruct.uz) ---
    server {
        listen 443 ssl http2;
        server_name weconstruct.uz www.weconstruct.uz;

        # --- Настройки безопасности SSL/TLS ---
        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        
        resolver 127.0.0.11 valid=30s;
    
        # Раздача статики
        location /static/ {
            alias /app/src/static/;
            expires 7d;
            access_log off;
        }

        # Раздача медиа
        location /media/ {
            alias /app/media/;
            expires 7d;
            access_log off;
        }

        # Проксирование на FastAPI-приложение сайта
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://site_app;
        }
    }

    # --- СЕРВЕР ДЛЯ АДМИНКИ (admin.weconstruct.uz) ---
    server {
        listen 443 ssl http2;
        server_name admin.weconstruct.uz;

        # Увеличение лимита размера запроса для загрузки файлов
        client_max_body_size 50M;

        # --- Настройки безопасности SSL/TLS ---
        ssl_certificate /etc/letsencrypt/live/weconstruct.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weconstruct.uz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        resolver 127.0.0.11 valid=30s;

        # Раздача статики
        location /static/ {
            alias /app/src/static/;
            expires 7d;
            access_log off;
        }

        # Раздача медиа
        location /media/ {
            alias /app/media/;
            expires 7d;
            access_log off;
        }
        
        # Проксирование на FastAPI-приложение админки
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://admin_app;
        }
    }
}