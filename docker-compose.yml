services:
  db:
    image: postgres:15
    volumes:
      - db_data:/var/lib/postgresql/data/
    env_file: .env 
    restart: unless-stopped
    environment:
      - PGTZ=Asia/Tashkent

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  site:
    build: .
    # Запускаем ТОЛЬКО приложение сайта
    command: gunicorn -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 main:site_app
    environment:
      - FORWARDED_ALLOW_IPS=*
      - TZ=Asia/Tashkent
    volumes:
      - .:/app
      - media_volume:/app/media
    depends_on:
      - db
      - redis
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ru"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # НОВЫЙ СЕРВИС ДЛЯ АДМИНКИ
  admin:
    build: .
    command: gunicorn -w 2 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 main:admin_app
    environment:
      - FORWARDED_ALLOW_IPS=*
      - TZ=Asia/Tashkent
    volumes:
      - .:/app
      - media_volume:/app/media
    depends_on:
      - db
      - redis
    env_file: .env
    restart: unless-stopped
      
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443/tcp" 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./src/static:/app/src/static:ro
      - media_volume:/app/media:ro
    depends_on:
      site: 
        condition: service_healthy
      admin: 
        condition: service_started
    restart: unless-stopped
    command: nginx -g 'daemon off;'
    
volumes:
  db_data:
  media_volume: