services:
  db:
    image: postgres:15
    volumes:
      - db_data:/var/lib/postgresql/data/
    env_file: .env
    restart: unless-stopped
    environment:
      - PGTZ=Asia/Tashkent

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  site:
    build: .
    command: gunicorn --chdir /app/src -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 main:app
    environment:
      - APP_TO_RUN=site
      - FORWARDED_ALLOW_IPS=*
      - TZ=Asia/Tashkent
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      - ./media:/app/media
    depends_on:
      - db
      - redis
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/uz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  
  admin:
    build: .
    command: gunicorn --chdir /app/src -w 2 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 main:app
    environment:
      - APP_TO_RUN=admin
      - FORWARDED_ALLOW_IPS=*
      - TZ=Asia/Tashkent
      - GOOGLE_CREDENTIALS_FILE=/app/credentials.json
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./media:/app/media
      - ./config/credentials.json:/app/credentials.json:ro
    depends_on:
      - db
      - redis
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./media:/app/media:ro
      - ./src/static:/app/src/static:ro 
    depends_on:
      site: 
        condition: service_healthy
      admin: 
        condition: service_healthy
    restart: unless-stopped
    
volumes:
  db_data: