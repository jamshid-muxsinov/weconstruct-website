services:
  db:
    image: postgres:15
    volumes:
      - db_data:/var/lib/postgresql/data/
    env_file: .env 
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    command: gunicorn -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 main:app
    volumes:
      - static_volume:/app/src/static
      - media_volume:/app/media
    depends_on:
      - db
      - redis
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ru"]
      interval: 30s    
      timeout: 10s     
      retries: 5        
      start_period: 30s 
      
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443" 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static_volume:/app/src/static:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    command: /bin/sh -c "mkdir -p /var/run/nginx && nginx -g 'daemon off;'"
    
volumes:
  db_data:
  static_volume:
  media_volume: