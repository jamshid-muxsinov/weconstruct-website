services:
  db:
    image: postgres:15
    volumes:
      - db_data:/var/lib/postgresql/data/
    env_file: .env 
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    volumes:
      - static_volume:/app/src/static
      - media_volume:/app/media
    depends_on:
      - db
      - redis
    env_file: .env
    restart: unless-stopped
      
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/src/static:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  db_data:
  static_volume:
  media_volume: